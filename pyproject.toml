[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "real-analysis-checker"
version = "0.0.1"
description = "AI-assisted real analysis proof checker backed by Lean 4 and Mathlib"
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are added by the milestone that first needs them
# (see docs/DEVELOPMENT_PLAN.md).
dependencies = [
    "anthropic>=1.0,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lean and live-LLM tests are opt-in: `pytest -m lean`, `pytest -m llm`.
addopts = "-m 'not lean and not llm'"
markers = [
    "lean: needs a local Lean 4 + Mathlib installation",
    "llm: calls the real LLM API (costs money; opt-in only)",
]
